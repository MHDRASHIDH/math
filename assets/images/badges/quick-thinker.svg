<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- Top button -->
  <rect x="44" y="10" width="12" height="8" rx="2" fill="#ef4444"/>
  <rect x="42" y="16" width="16" height="4" rx="2" fill="#991b1b"/>
  <!-- Stopwatch Body -->
  <circle cx="50" cy="54" r="38" fill="#ef4444" stroke="#f87171" stroke-width="3"/>
  <circle cx="50" cy="54" r="30" fill="#38bdf8"/>
  <circle cx="50" cy="54" r="28" fill="#0284c7"/>
  <!-- Clock ticks -->
  <line x1="50" y1="30" x2="50" y2="34" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="50" y1="74" x2="50" y2="78" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="26" y1="54" x2="30" y2="54" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="70" y1="54" x2="74" y2="54" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Clock Hands pointing to 10s -->
  <line x1="50" y1="54" x2="50" y2="36" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
  <line x1="50" y1="54" x2="64" y2="44" stroke="#facc15" stroke-width="3" stroke-linecap="round"/>
  <circle cx="50" cy="54" r="4" fill="#facc15"/>
</svg>
