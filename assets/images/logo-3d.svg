<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 140" width="100%" height="100%">
  <defs>
    <!-- Yellow/Gold 3D Gradient for Math -->
    <linearGradient id="mathGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="25%" stop-color="#fef08a"/>
      <stop offset="70%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <!-- Cyan/Blue 3D Gradient for Mind Kids -->
    <linearGradient id="blueGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e0f2fe"/>
      <stop offset="25%" stop-color="#38bdf8"/>
      <stop offset="70%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#075985"/>
    </linearGradient>
    <filter id="logoShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="4" flood-color="#1e1b4b" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Mascot Brain in Left Emblem -->
  <g transform="translate(10, 10)">
    <!-- Outer Glow Circle -->
    <circle cx="55" cy="55" r="50" fill="#38bdf8" opacity="0.3"/>
    <circle cx="55" cy="55" r="44" fill="#1e1b4b" stroke="#00f5ff" stroke-width="4"/>
    <!-- Mini Brain Icon -->
    <ellipse cx="44" cy="55" rx="14" ry="12" fill="#ff70a6"/>
    <ellipse cx="66" cy="55" rx="14" ry="12" fill="#ff70a6"/>
    <circle cx="55" cy="48" r="15" fill="#ff70a6"/>
    <circle cx="55" cy="58" r="14" fill="#ff5c9a"/>
    <!-- Eyes -->
    <circle cx="49" cy="53" r="3" fill="#ffffff"/>
    <circle cx="49" cy="53" r="1.5" fill="#030712"/>
    <circle cx="61" cy="53" r="3" fill="#ffffff"/>
    <circle cx="61" cy="53" r="1.5" fill="#030712"/>
    <!-- Smile -->
    <path d="M 52 61 Q 55 65 58 61" stroke="#4a044e" stroke-width="1.8" fill="none" stroke-linecap="round"/>
  </g>

  <!-- 3D Bubbly Text -->
  <g transform="translate(120, 30)" filter="url(#logoShadow)">
    <!-- Outline / Extrusion Layer (Deep Indigo) -->
    <text x="0" y="44" font-family="'Fredoka One', 'Nunito', sans-serif" font-size="52" font-weight="900" fill="#1e1b4b" stroke="#1e1b4b" stroke-width="12" stroke-linejoin="round">MathMind</text>
    <text x="50" y="94" font-family="'Fredoka One', 'Nunito', sans-serif" font-size="52" font-weight="900" fill="#1e1b4b" stroke="#1e1b4b" stroke-width="12" stroke-linejoin="round">Kids</text>

    <!-- Front Fill Layer -->
    <text x="0" y="44" font-family="'Fredoka One', 'Nunito', sans-serif" font-size="52" font-weight="900" fill="url(#mathGrad)">Math<tspan fill="url(#blueGrad)">Mind</tspan></text>
    <text x="50" y="94" font-family="'Fredoka One', 'Nunito', sans-serif" font-size="52" font-weight="900" fill="url(#mathGrad)">Kids</text>
  </g>

  <!-- Sparkles -->
  <polygon points="115,20 118,28 126,30 118,33 115,40 112,33 104,30 112,28" fill="#fde047"/>
  <polygon points="380,85 382,90 388,92 382,94 380,100 378,94 372,92 378,90" fill="#00f5ff"/>
</svg>
