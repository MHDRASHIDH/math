<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <!-- Room Background Gradient -->
    <linearGradient id="roomBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ecfdf5"/>
      <stop offset="60%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#fed7aa"/>
    </linearGradient>
    <!-- Window Sunlight -->
    <linearGradient id="windowLight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#e0f2fe" stop-opacity="0.4"/>
    </linearGradient>
    <!-- Wooden Desk -->
    <linearGradient id="deskWood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="40%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#92400e"/>
    </linearGradient>
    <!-- Red Backpack Gradients -->
    <linearGradient id="bpRed" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="50%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
    <!-- Blue Water Bottle -->
    <linearGradient id="bottleBlue" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="40%" stop-color="#0284c7"/>
      <stop offset="80%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#0c4a6e"/>
    </linearGradient>
    <!-- Basketball Orange -->
    <radialGradient id="bballGrad" cx="38%" cy="32%" r="65%">
      <stop offset="0%" stop-color="#fdba74"/>
      <stop offset="45%" stop-color="#f97316"/>
      <stop offset="85%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#9a3412"/>
    </radialGradient>
    <filter id="deskObjShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="4" dy="8" stdDeviation="6" flood-color="#78350f" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Wall Background -->
  <rect x="0" y="0" width="600" height="400" fill="url(#roomBg)"/>

  <!-- Window Frame in Background -->
  <g opacity="0.45">
    <rect x="360" y="30" width="180" height="180" rx="8" fill="url(#windowLight)" stroke="#94a3b8" stroke-width="4"/>
    <line x1="450" y1="30" x2="450" y2="210" stroke="#94a3b8" stroke-width="3"/>
    <line x1="360" y1="120" x2="540" y2="120" stroke="#94a3b8" stroke-width="3"/>
  </g>

  <!-- Wooden Table / Desk -->
  <polygon points="0,220 600,220 600,400 0,400" fill="url(#deskWood)"/>
  <!-- Desk Highlights & Wood Plank Lines -->
  <line x1="0" y1="223" x2="600" y2="223" stroke="#fef3c7" stroke-width="3" opacity="0.6"/>
  <line x1="0" y1="285" x2="600" y2="285" stroke="#78350f" stroke-width="2" opacity="0.25"/>
  <line x1="0" y1="345" x2="600" y2="345" stroke="#78350f" stroke-width="2" opacity="0.25"/>

  <!-- 1. RED BACKPACK (Left) -->
  <g filter="url(#deskObjShadow)" id="obj-backpack">
    <!-- Top Handle -->
    <path d="M 85 175 C 85 140, 135 140, 135 175" fill="none" stroke="#7f1d1d" stroke-width="12" stroke-linecap="round"/>
    <path d="M 85 175 C 85 145, 135 145, 135 175" fill="none" stroke="#facc15" stroke-width="4" stroke-linecap="round"/>
    <!-- Backpack Main Dome -->
    <path d="M 60 210 C 60 145, 90 140, 110 140 C 130 140, 160 145, 160 210 L 160 300 C 160 315, 60 315, 60 300 Z" fill="url(#bpRed)"/>
    <!-- Yellow Piping Accent -->
    <path d="M 68 215 C 68 155, 92 148, 110 148 C 128 148, 152 155, 152 215" fill="none" stroke="#fde047" stroke-width="4"/>
    <!-- Front Pocket -->
    <rect x="70" y="235" width="80" height="65" rx="14" fill="#dc2626" stroke="#991b1b" stroke-width="2"/>
    <path d="M 72 250 L 148 250" stroke="#facc15" stroke-width="3" stroke-linecap="round"/>
    <!-- Gold Zipper Pull -->
    <circle cx="110" cy="250" r="4.5" fill="#facc15"/>
    <!-- Cute Badge on backpack -->
    <circle cx="110" cy="195" r="9" fill="#facc15"/>
    <polygon points="110,189 112,193 116,193 113,196 114,200 110,198 106,200 107,196 104,193 108,193" fill="#dc2626"/>
  </g>

  <!-- 2. BLUE WATER BOTTLE (Next to backpack) -->
  <g filter="url(#deskObjShadow)" id="obj-bottle" transform="translate(180, 170)">
    <!-- Cap & Spout -->
    <rect x="18" y="0" width="14" height="12" rx="4" fill="#0284c7"/>
    <path d="M 16 10 C 14 0, 36 0, 34 10" fill="none" stroke="#0369a1" stroke-width="4"/>
    <!-- Neck -->
    <rect x="12" y="12" width="26" height="14" rx="4" fill="#0284c7"/>
    <!-- Body -->
    <rect x="6" y="26" width="38" height="110" rx="10" fill="url(#bottleBlue)"/>
    <!-- Grips / Ridges -->
    <line x1="8" y1="55" x2="42" y2="55" stroke="#38bdf8" stroke-width="3"/>
    <line x1="8" y1="75" x2="42" y2="75" stroke="#38bdf8" stroke-width="3"/>
    <!-- Highlights -->
    <rect x="10" y="32" width="5" height="98" rx="2" fill="#ffffff" opacity="0.35"/>
  </g>

  <!-- 3. STACK OF 3 BOOKS -->
  <g filter="url(#deskObjShadow)" id="obj-books" transform="translate(245, 210)">
    <!-- Bottom Book (Blue) -->
    <rect x="0" y="65" width="105" height="24" rx="4" fill="#2563eb"/>
    <rect x="95" y="68" width="8" height="18" fill="#f8fafc"/>
    <line x1="4" y1="77" x2="94" y2="77" stroke="#fbbf24" stroke-width="3"/>
    <!-- Middle Book (White / Cream) -->
    <rect x="6" y="42" width="98" height="22" rx="4" fill="#f1f5f9"/>
    <rect x="94" y="45" width="8" height="16" fill="#cbd5e1"/>
    <line x1="10" y1="53" x2="92" y2="53" stroke="#64748b" stroke-width="2"/>
    <!-- Top Book (Green) -->
    <rect x="12" y="20" width="92" height="21" rx="4" fill="#16a34a"/>
    <rect x="94" y="23" width="8" height="15" fill="#f8fafc"/>
    <line x1="16" y1="30" x2="92" y2="30" stroke="#facc15" stroke-width="2.5"/>
  </g>

  <!-- 4. SPECTACLES / EYEGLASSES (in front of books) -->
  <g filter="url(#deskObjShadow)" id="obj-glasses" transform="translate(255, 290)">
    <!-- Left Lens Rim -->
    <circle cx="28" cy="20" r="16" fill="none" stroke="#1d4ed8" stroke-width="4.5"/>
    <ellipse cx="28" cy="20" rx="14" ry="14" fill="#e0f2fe" opacity="0.35"/>
    <line x1="20" y1="12" x2="36" y2="28" stroke="#ffffff" stroke-width="2" opacity="0.6"/>
    <!-- Right Lens Rim -->
    <circle cx="72" cy="20" r="16" fill="none" stroke="#1d4ed8" stroke-width="4.5"/>
    <ellipse cx="72" cy="20" rx="14" ry="14" fill="#e0f2fe" opacity="0.35"/>
    <line x1="64" y1="12" x2="80" y2="28" stroke="#ffffff" stroke-width="2" opacity="0.6"/>
    <!-- Bridge -->
    <path d="M 44 18 Q 50 14 56 18" fill="none" stroke="#1d4ed8" stroke-width="4.5" stroke-linecap="round"/>
    <!-- Left Temple arm folded back -->
    <path d="M 12 18 L 2 6" stroke="#1e40af" stroke-width="4" stroke-linecap="round"/>
    <!-- Right Temple arm folded back -->
    <path d="M 88 18 L 98 6" stroke="#1e40af" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- 5. BASKETBALL (Orange, between books and plant) -->
  <g filter="url(#deskObjShadow)" id="obj-basketball" transform="translate(380, 215)">
    <circle cx="50" cy="50" r="48" fill="url(#bballGrad)"/>
    <!-- Seams / Lines of Basketball -->
    <circle cx="50" cy="50" r="48" fill="none" stroke="#18181b" stroke-width="3"/>
    <!-- Horizontal & Vertical Seams -->
    <line x1="2" y1="50" x2="98" y2="50" stroke="#18181b" stroke-width="3.5"/>
    <line x1="50" y1="2" x2="50" y2="98" stroke="#18181b" stroke-width="3.5"/>
    <!-- Curved Side Seams -->
    <path d="M 22 12 Q 42 50 22 88" fill="none" stroke="#18181b" stroke-width="3.5"/>
    <path d="M 78 12 Q 58 50 78 88" fill="none" stroke="#18181b" stroke-width="3.5"/>
    <!-- Highlight on top left -->
    <ellipse cx="36" cy="30" rx="15" ry="10" fill="#ffffff" opacity="0.3" transform="rotate(-30 36 30)"/>
  </g>

  <!-- 6. POTTED GREEN PLANT (Right) -->
  <g filter="url(#deskObjShadow)" id="obj-plant" transform="translate(480, 150)">
    <!-- Plant Leaves -->
    <!-- Center tall leaf -->
    <path d="M 45 60 C 45 20, 25 0, 45 -15 C 65 0, 45 20, 45 60 Z" fill="#22c55e" stroke="#15803d" stroke-width="2"/>
    <line x1="45" y1="50" x2="45" y2="-8" stroke="#15803d" stroke-width="2"/>
    <!-- Left leaf -->
    <path d="M 42 65 C 20 40, -5 30, -10 15 C 10 18, 30 40, 42 65 Z" fill="#16a34a" stroke="#14532d" stroke-width="2"/>
    <!-- Right leaf -->
    <path d="M 48 65 C 70 40, 95 30, 100 15 C 80 18, 60 40, 48 65 Z" fill="#4ade80" stroke="#15803d" stroke-width="2"/>
    <!-- Lower left leaf -->
    <path d="M 40 70 C 15 65, 0 60, 5 45 C 22 55, 35 65, 40 70 Z" fill="#15803d"/>
    <!-- Lower right leaf -->
    <path d="M 50 70 C 75 65, 90 60, 85 45 C 68 55, 55 65, 50 70 Z" fill="#22c55e"/>

    <!-- White Ceramic Pot -->
    <polygon points="20,70 70,70 64,125 26,125" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
    <!-- Soil -->
    <ellipse cx="45" cy="70" rx="25" ry="6" fill="#78350f"/>
    <!-- Pot rim -->
    <ellipse cx="45" cy="70" rx="26" ry="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  </g>
</svg>
