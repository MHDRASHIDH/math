<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <radialGradient id="pandaFace" cx="45%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="75%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </radialGradient>
  </defs>
  <!-- Black Ears -->
  <circle cx="24" cy="22" r="14" fill="#0f172a"/>
  <circle cx="76" cy="22" r="14" fill="#0f172a"/>
  <!-- White Face -->
  <circle cx="50" cy="54" r="36" fill="url(#pandaFace)"/>
  <!-- Black Eye Patches -->
  <ellipse cx="34" cy="50" rx="10" ry="13" fill="#0f172a" transform="rotate(-15 34 50)"/>
  <ellipse cx="66" cy="50" rx="10" ry="13" fill="#0f172a" transform="rotate(15 66 50)"/>
  <!-- Eyes -->
  <circle cx="34" cy="48" r="4" fill="#ffffff"/>
  <circle cx="35" cy="48" r="2.5" fill="#020617"/>
  <circle cx="33" cy="46" r="1" fill="#ffffff"/>

  <circle cx="66" cy="48" r="4" fill="#ffffff"/>
  <circle cx="65" cy="48" r="2.5" fill="#020617"/>
  <circle cx="64" cy="46" r="1" fill="#ffffff"/>

  <!-- Cheeks Blush -->
  <ellipse cx="25" cy="62" rx="6" ry="3.5" fill="#f472b6" opacity="0.4"/>
  <ellipse cx="75" cy="62" rx="6" ry="3.5" fill="#f472b6" opacity="0.4"/>

  <!-- Nose -->
  <ellipse cx="50" cy="62" rx="6" ry="4" fill="#0f172a"/>
  <!-- Mouth -->
  <path d="M 44 68 Q 50 74 56 68" stroke="#0f172a" stroke-width="2.5" fill="none" stroke-linecap="round"/>
</svg>
